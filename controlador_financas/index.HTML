<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Premium | Gestor Financeiro</title>
    <!-- Importação do Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Sistema de Variáveis de Cores (Dark Mode Premium) */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b90;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --color-primary: #6366f1; /* Indigo */
            --color-primary-hover: #4f46e5;
            --color-success: #10b981; /* Esmeralda */
            --color-danger: #ef4444; /* Vermelho */
            --color-warning: #f59e0b; /* Âmbar */
            --font-main: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, var(--color-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Dashboard de Saldo */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: #475569;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--color-primary);
        }

        .card.card-renda::before { background-color: var(--color-primary); }
        .card.card-despesas::before { background-color: var(--color-warning); }
        .card.card-saldo::before { background-color: var(--badge-color, var(--color-success)); }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .card-btn-edit {
            background: none;
            border: none;
            color: var(--color-primary);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .card-btn-edit:hover {
            color: #a78bfa;
            text-decoration: underline;
        }

        /* Renda Input Container (Expansível) */
        .renda-form-container {
            display: none;
            margin-top: 10px;
            animation: fadeIn 0.3s ease;
        }

        /* Formulários e Inputs */
        .section-form {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 150px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input, select {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button.btn {
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button.btn:hover {
            background-color: var(--color-primary-hover);
        }

        button.btn:active {
            transform: scale(0.98);
        }

        button.btn-secundario {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        button.btn-secundario:hover {
            background-color: var(--border-color);
        }

        /* Seção Histórico */
        .section-historico {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .historico-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gastos-lista {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .gasto-item {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s, border-color 0.2s;
            animation: slideIn 0.3s ease;
        }

        .gasto-item:hover {
            transform: translateX(4px);
            border-color: #475569;
        }

        .gasto-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .gasto-categoria-icon {
            font-size: 1.3rem;
            background-color: var(--bg-secondary);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .gasto-detalhes {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .gasto-nome {
            font-weight: 600;
            font-size: 1rem;
        }

        .gasto-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 10px;
        }

        .badge-categoria {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-fixo {
            background-color: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
        }

        .badge-variavel {
            background-color: rgba(245, 158, 11, 0.15);
            color: #fde047;
        }

        .gasto-valores {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .gasto-preco {
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Ações */
        .gasto-acoes {
            display: flex;
            gap: 8px;
        }

        .btn-acao {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            color: var(--text-secondary);
            transition: background-color 0.2s, color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-acao:hover {
            background-color: var(--bg-secondary);
        }

        .btn-excluir:hover {
            color: var(--color-danger);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .btn-editar:hover {
            color: var(--color-primary);
            background-color: rgba(99, 102, 241, 0.1);
        }

        /* Modal / Edit Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Utilitários */
        .vazio-msg {
            color: var(--text-secondary);
            text-align: center;
            padding: 30px;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Responsividade */
        @media (max-width: 600px) {
            body { padding: 20px 10px; }
            .form-row { flex-direction: column; }
            .gasto-item { flex-direction: column; align-items: flex-start; }
            .gasto-valores { width: 100%; justify-content: space-between; margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <header>
            <h1>Meu Gestor Financeiro</h1>
            <p>Monitore suas finanças e economize com inteligência</p>
        </header>

        <!-- Dashboard -->
        <section class="dashboard">
            <div class="card card-renda">
                <div class="card-title">
                    <span>Renda Mensal</span>
                    <button class="card-btn-edit" onclick="toggleRendaForm()">Editar</button>
                </div>
                <div class="card-value" id="txt-renda">R$ 0,00</div>
                
                <!-- Formulário Inline para Renda -->
                <div class="renda-form-container" id="renda-form-container">
                    <div style="display: flex; gap: 8px;">
                        <input type="number" id="renda-input" placeholder="R$ Renda" style="padding: 8px; font-size: 0.85rem; flex: 1;">
                        <button class="btn" onclick="atualizarRenda()" style="padding: 8px 12px; font-size: 0.85rem;">Salvar</button>
                    </div>
                </div>
            </div>

            <div class="card card-despesas">
                <div class="card-title">Despesas Totais</div>
                <div class="card-value" id="txt-despesas" style="color: var(--color-warning);">R$ 0,00</div>
            </div>

            <div class="card card-saldo" id="card-saldo">
                <div class="card-title">Saldo Livre</div>
                <div class="card-value" id="txt-saldo">R$ 0,00</div>
            </div>
        </section>

        <!-- Form Novo Gasto -->
        <section class="section-form">
            <h3 class="section-title">⚡ Registrar Novo Gasto</h3>
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="nome">Descrição</label>
                    <input type="text" id="nome" placeholder="O que você comprou?">
                </div>
                <div class="form-group">
                    <label for="valor">Valor (R$)</label>
                    <input type="number" id="valor" step="0.01" min="0.01" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria">
                        <option value="fixo">Fixo</option>
                        <option value="variavel" selected>Variável</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mesAno">Mês/Ano</label>
                    <input type="month" id="mesAno" name="mesAno">
        </div>
    </div>

    <div style="display: flex; justify-content: flex-end; margin-top: 5px;">
        <button class="btn" onclick="adicionarGasto()">➕ Salvar Gasto</button>
    </div>
</section>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 5px;">
                <button class="btn" onclick="adicionarGasto()">➕ Salvar Gasto</button>
            </div>
        </section>

        <!-- Histórico -->
        <section class="section-historico">
            <div class="historico-header">
                <h3 class="section-title">📊 Histórico de Gastos</h3>
            </div>
            <div class="gastos-lista" id="lista-gastos">
                <!-- Preenchido via JavaScript -->
            </div>
        </section>

    </div>

    <!-- Modal de Edição -->
    <div class="modal" id="modal-editar">
        <div class="modal-content">
            <h3 class="section-title" style="margin-bottom: 10px;">✏️ Editar Gasto</h3>
            <input type="hidden" id="edit-id">
            
            <div class="form-group">
                <label for="edit-nome">Descrição</label>
                <input type="text" id="edit-nome">
            </div>
            
            <div class="form-group">
                <label for="edit-valor">Valor (R$)</label>
                <input type="number" id="edit-valor" step="0.01" min="0.01">
            </div>
            
            <div class="form-group">
                <label for="edit-categoria">Categoria</label>
                <select id="edit-categoria">
                    <option value="fixo">Fixo</option>
                    <option value="variavel">Variável</option>
                </select>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
                <button class="btn btn-secundario" onclick="fecharModalEditar()">Cancelar</button>
                <button class="btn" onclick="salvarEdicaoGasto()">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
